scenes.welcomescene.welcome_msg=Tomorrow`s RogueNight는 오픈 소스 게임 Shattered Pixel Dungeon을 기반으로 제작된 _명일방주_의 2차창작 게임입니다. 이 게임은 Yostar 혹은 Hypergryph​사의 요청으로 언제든지 배포 및 개발이 중단될 수 있습니다.\n\n당신은 로도스 아일랜드의 오퍼레이터로써, 탈룰라에게 잡혀간 박사를 구출해야만합니다. 행운을 빕니다!
scenes.welcomescene.update_intro=Tomorrow`s RogueNight가 업데이트되었습니다!
scenes.welcomescene.update_msg=자세한 내용은 변경 페이지를 참고해주세요!
scenes.welcomescene.patch_intro=Tomorrow`s RogueNight가 패치되었습니다!
scenes.welcomescene.patch_bugfixes=버그 수정이 있습니다.
scenes.welcomescene.patch_translations=번역 업데이트가 있습니다.
scenes.welcomescene.patch_balance=게임 밸런스의 수정이 있습니다.
scenes.welcomescene.patch_msg=이 업데이트는 몇가지 자잘한 수정과 성능 향상을 포함합니다.
scenes.welcomescene.what_msg=현재 저장된 게임은 Tomorrow`s RogueNight의 이전 버전에서 나온 것입니다!\n\n현재 버전에 등장하지 않는 요소들이 충돌을 일으킬 수 있으니, 조심하십시오!
scenes.welcomescene.lang_warning_title=미완성된 번역
scenes.welcomescene.lang_warning_msg=이 업데이트로 추가된 몇 가지 항목이 번역되지 않았습니다.\n\n몇몇 문장이 한국어로 나타날 수 있습니다.\n\n번역팀이 이를 해결하기 위해 작업 중이며 조만간 완전한 번역을 볼 수 있을 것입니다.\n\n기다려 주셔서 감사합니다.
scenes.welcomescene.continue=계속
scenes.welcomescene.changelist=변경사항
scenes.welcomescene.save_warning=최근에 게임 데이터를 저장하는 동안 게임이 중단되었습니다. 섀터드 픽셀 던전에는 이에 대한 보호 기능이 내장되어 있기 때문에 게임 데이터는 안전합니다.\n\n일반적으로 이 문제는 디바이스의 전원이 갑자기 끊기거나 게임이 정상적으로 종료되지 않았을 때 발생합니다. 대부분의 경우 모바일 디바이스에서 배터리 절약 기능으로 인해 이 문제가 발생할 수 있습니다. 이 오류가 반복될 경우 디바이스를 재시작해 보십시오.
